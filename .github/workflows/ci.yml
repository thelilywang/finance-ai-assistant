name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      # 沒有 Postgres / Ollama：需要 DB 的測試會自動 skip，LLM 呼叫在測試裡已用 monkeypatch 取代
      - run: pytest -q
