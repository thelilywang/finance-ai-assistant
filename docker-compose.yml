services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finance_ai_assistant_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/chainlit_schema.sql:/docker-entrypoint-initdb.d/init2_chainlit_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag -d finrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build: .
    container_name: finance_ai_assistant_mcp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGVECTOR_URL: postgresql://finrag:finrag@db:5432/finrag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 容器預設 UTC，會比台北時間慢 8 小時：台灣半夜 0-8 點時整個系統認定的「今天」
      # 會少一天，讓資料時效判斷與 MOPS 民國年計算全部偏移
      TZ: ${TZ:-Asia/Taipei}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.mcp_server"]
    # 不對 host 開 port：目前只有 app 需要連。要讓 Claude Desktop 等外部 client 連進來時，
    # 再單獨評估開放（屆時 MCP_AUTH_TOKEN 的 Bearer 驗證就是把關依據）
    healthcheck:
      # FastMCP 沒有 health endpoint，改探 /mcp 本身。不帶 token 會被 Bearer middleware
      # 擋成 401，而 401 正是要的訊號：uvicorn 有在聽、middleware 有在跑。
      # 不帶 token 是刻意的——healthcheck 不該碰密鑰，且 401 已足以判定存活。
      # 連不上時 urlopen 拋 URLError（非 HTTPError），exit 1。
      # 映像是 python:3.11-slim，沒有 curl/wget，故用 python。
      test: ["CMD", "python", "-c", "import urllib.request as r, urllib.error as e, sys\ntry: r.urlopen('http://localhost:8000/mcp', timeout=5)\nexcept e.HTTPError: pass\nexcept Exception: sys.exit(1)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      - ./data:/app/data

  app:
    build: .
    container_name: finance_ai_assistant_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGVECTOR_URL: postgresql://finrag:finrag@db:5432/finrag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 容器預設 UTC，會比台北時間慢 8 小時：台灣半夜 0-8 點時整個系統認定的「今天」
      # 會少一天，讓資料時效判斷與 MOPS 民國年計算全部偏移
      TZ: ${TZ:-Asia/Taipei}
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      # 映像檔沒有 .git，tracing 的 git fallback 取不到版本，得由外部帶進來，
      # 否則 Langfuse 上所有 trace 的 release 都是 unknown，無法歸因版本
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
